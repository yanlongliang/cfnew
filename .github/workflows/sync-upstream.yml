name: Sync with upstream
on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点（北京时间早8点）自动同步
  workflow_dispatch:       # 允许手动点按钮立即同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉完整历史，避免合并失败

      - name: Set Git user
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/原作者/原仓库.git  # 改这里！

      - name: Fetch and merge
        run: |
          git fetch upstream
          git checkout main
          git merge upstream/main  # 用 merge 保留历史；想变基可换 git rebase upstream/main

      - name: Push back to fork
        uses: ad-m/github-push-action@master
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
