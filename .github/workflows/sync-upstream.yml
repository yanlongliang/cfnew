name: Auto Sync Upstream
on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时同步一次
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 使用官方原生 git 命令方式，完全不依赖任何 JS Action → 0 警告
      - name: Sync with upstream
        uses: tobilen/upstream-sync@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_repository: byJoey/cfnew  # 例如：vuejs/core
          upstream_branch: main                 # 上游分支
          target_branch: main                   # 你的分支
          force: false                          # 不强制覆盖，安全合并
